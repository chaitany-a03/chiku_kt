<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:Poppins,sans-serif;

background:linear-gradient(-45deg,#ff4d6d,#ff758f,#ffb3c6,#ffc2d1);

background-size:400% 400%;

animation:bg 10s infinite;

}


@keyframes bg{

0%{background-position:0% 50%}

50%{background-position:100% 50%}

100%{background-position:0% 50%}

}


/* Hearts */

.heart{

position:absolute;

bottom:-50px;

color:white;

animation:up linear infinite;

opacity:.7;

}


@keyframes up{

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}



/* Card */


.card{

width:360px;

padding:35px;

text-align:center;

border-radius:30px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

box-shadow:0 0 40px pink;

position:relative;

z-index:2;

}



h1{

font-family:"Great Vibes";

font-size:60px;

color:white;

text-shadow:0 0 20px hotpink;

}



p{

color:white;

margin:10px;

}



.display{

margin:25px auto;

width:220px;

height:60px;

border-radius:15px;

background:rgba(255,255,255,.2);

color:white;

font-size:35px;

letter-spacing:10px;

display:flex;

align-items:center;

justify-content:center;

}




.keypad{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

}



button{

height:60px;

border:none;

border-radius:18px;

font-size:22px;

color:white;

cursor:pointer;

background:rgba(255,255,255,.2);

box-shadow:0 0 15px hotpink;

}



button:hover{

transform:scale(1.1);

}



.enter{

background:#ff2e63;

}



#msg{

color:white;

margin-top:15px;

}



.success{

animation:glow .5s infinite alternate;

}



@keyframes glow{

from{

box-shadow:0 0 20px lime;

}

to{

box-shadow:0 0 60px lime;

}

}



</style>

</head>


<body>


<audio id="music" loop>

<source src="song.mp3" type="audio/mpeg">

</audio>



<div class="card" id="card">


<h1>
For My Love ❤️
</h1>


<p>
Only my Queen can unlock this surprise.
</p>



<div class="display" id="display">

••••

</div>



<div class="keypad">


<button onclick="press(1)">1</button>

<button onclick="press(2)">2</button>

<button onclick="press(3)">3</button>


<button onclick="press(4)">4</button>

<button onclick="press(5)">5</button>

<button onclick="press(6)">6</button>


<button onclick="press(7)">7</button>

<button onclick="press(8)">8</button>

<button onclick="press(9)">9</button>


<button onclick="back()">⌫</button>

<button onclick="press(0)">0</button>

<button class="enter" onclick="check()">❤️</button>


</div>


<div id="msg"></div>


</div>




<script>


// Floating hearts

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(5+Math.random()*8)+"s";

document.body.appendChild(h);

}



// Password


let password="";

const correct="0827";



function update(){

document.getElementById("display").innerHTML=

password.length ? "●".repeat(password.length) : "••••";

}



function press(n){

if(password.length<4){

password+=n;

update();

}

}



function back(){

password=password.slice(0,-1);

update();

}




function check(){


let msg=document.getElementById("msg");

let card=document.getElementById("card");



if(password===correct){


msg.innerHTML="❤️ Welcome My Princess ❤️";


card.classList.add("success");



// Music start

let music=document.getElementById("music");

music.volume=0.5;

music.play();


localStorage.setItem(
"musicStarted",
"yes"
);



setTimeout(()=>{


window.location.href="page2.html";


},1500);



}

else{


msg.innerHTML="💔 Wrong Password";


password="";

update();


}

}



update();


</script>


</body>
</html>
