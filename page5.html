<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Happy Moments ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

font-family:Poppins,sans-serif;


background:

linear-gradient(-45deg,#330010,#8f2045,#ff758f,#ffc2d1);


background-size:400% 400%;

animation:bg 12s infinite;

position:relative;

}



@keyframes bg{

0%{background-position:0% 50%}

50%{background-position:100% 50%}

100%{background-position:0% 50%}

}




h1{

position:absolute;

top:35px;


font-family:"Great Vibes";

font-size:75px;


color:white;


text-shadow:

0 0 20px hotpink,
0 0 40px deeppink;


}




.video-box{


width:700px;


padding:20px;


border-radius:30px;


background:rgba(255,255,255,.15);


backdrop-filter:blur(15px);


box-shadow:

0 0 40px hotpink;


animation:open 2s ease;


}



@keyframes open{


from{

opacity:0;

transform:scale(.5);

}


to{

opacity:1;

transform:scale(1);

}


}




video{


width:100%;

border-radius:20px;


}



.memory-text{


margin-top:20px;


font-size:35px;


font-family:"Great Vibes";


color:white;


text-shadow:

0 0 15px hotpink;


}





.heart{


position:absolute;


color:white;


font-size:25px;


animation:rain linear forwards;


}



@keyframes rain{


0%{

transform:translateY(-100px) scale(.5);

opacity:1;

}


100%{

transform:translateY(110vh) scale(1.5);

opacity:0;

}


}




.pop{


position:absolute;


animation:pop 1s forwards;


}



@keyframes pop{


0%{

transform:scale(0);

opacity:0;

}


50%{

transform:scale(1.5);

opacity:1;

}


100%{

transform:scale(1);

opacity:0;

}


}


</style>


</head>


<body>



<!-- Music -->

<audio id="loveMusic" loop>

<source src="song.mp3" type="audio/mpeg">

</audio>




<h1>
Our Happy Moments ❤️
</h1>



<div class="video-box">


<video controls autoplay>

<source src="ourvideo.mp4" type="video/mp4">

</video>



<div class="memory-text">

Our Best Memory ❤️

</div>


</div>






<script>



// Continue music


const music=document.getElementById("loveMusic");


music.volume=.5;



let saved=localStorage.getItem("musicTime");

if(saved){

music.currentTime=saved;

}



if(localStorage.getItem("musicStarted")=="yes"){

music.play().catch(()=>{});

}



setInterval(()=>{


if(!music.paused){

localStorage.setItem(

"musicTime",

music.currentTime

);

}


},1000);







// Heart rain


setInterval(()=>{


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"vw";


h.style.fontSize=(20+Math.random()*35)+"px";


h.style.animationDuration=(3+Math.random()*3)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},6000);



},300);








// Pop heart every 1 second


setInterval(()=>{


let p=document.createElement("div");


p.className="pop";


p.innerHTML="💖";


p.style.left=Math.random()*100+"vw";


p.style.top=Math.random()*80+"vh";


p.style.fontSize=(25+Math.random()*40)+"px";



document.body.appendChild(p);



setTimeout(()=>{

p.remove();

},1000);



},1000);



</script>


</body>

</html>
