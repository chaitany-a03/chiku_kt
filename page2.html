<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{


height:100vh;

overflow:hidden;


display:flex;

justify-content:center;

align-items:center;

flex-direction:column;


font-family:Poppins,sans-serif;


background:

linear-gradient(-45deg,#330010,#5a0d21,#8f2045,#f5b8cb);


background-size:400% 400%;


animation:bg 12s ease infinite;


position:relative;


}



@keyframes bg{


0%{

background-position:0% 50%;

}


50%{

background-position:100% 50%;

}


100%{

background-position:0% 50%;

}


}



/* Floating particles */


.particle{


position:absolute;


width:5px;

height:5px;


border-radius:50%;


background:#ffd6e7;


opacity:.6;


animation:float linear infinite;


}



@keyframes float{


0%{

transform:translateY(100vh);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:translateY(-100vh);

opacity:0;

}


}





/* Text */


h1{


font-family:"Great Vibes",cursive;


font-size:70px;


color:white;


text-shadow:


0 0 15px hotpink,
0 0 35px deeppink;


text-align:center;


min-height:170px;


padding:20px;


}





/* Heart Button */


button{


margin-top:30px;


width:90px;

height:90px;


border:none;


border-radius:50%;


font-size:42px;


cursor:pointer;


background:rgba(255,255,255,.15);


color:white;


backdrop-filter:blur(10px);


box-shadow:


0 0 20px hotpink,
0 0 40px deeppink;



transition:.3s;


display:none;


animation:pulse 1.5s infinite;


}



button:hover{


transform:scale(1.15);


}




@keyframes pulse{


0%{

transform:scale(1);

}


50%{

transform:scale(1.08);

}


100%{

transform:scale(1);

}


}




/* Falling hearts */


.heart{


position:absolute;


font-size:28px;


animation:fall linear forwards;


pointer-events:none;


}



@keyframes fall{


0%{

transform:translateY(-100px);

opacity:1;

}


100%{

transform:translateY(110vh);

opacity:0;

}


}



</style>


</head>



<body>


<!-- Music -->

<audio id="loveMusic" loop>

<source src="song.mp3" type="audio/mpeg">

</audio>




<h1 id="text"></h1>



<button id="heart">

❤️

</button>





<script>



// MUSIC CONTINUE SYSTEM


const music=document.getElementById("loveMusic");

music.volume=0.5;



let savedTime=localStorage.getItem("musicTime");

if(savedTime){

music.currentTime=savedTime;

}



if(localStorage.getItem("musicStarted")=="yes"){


music.play().catch(()=>{});


}




setInterval(()=>{


if(!music.paused){


localStorage.setItem(

"musicTime",

music.currentTime

);


}


},1000);






// Floating particles


for(let i=0;i<30;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDuration=(8+Math.random()*6)+"s";


p.style.animationDelay=Math.random()*8+"s";


document.body.appendChild(p);


}






// Typewriter


const message=

`Happy
Girlfriend's Day

KT ❤️`;



let i=0;



function type(){



if(i<message.length){



document.getElementById("text").innerHTML +=

message.charAt(i);



i++;


setTimeout(type,120);



}

else{


document.getElementById("heart").style.display="block";


}


}



type();








// Heart Rain


const btn=document.getElementById("heart");



btn.onclick=function(){



for(let i=0;i<150;i++){



setTimeout(()=>{



let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"vw";


h.style.fontSize=(20+Math.random()*30)+"px";


h.style.animationDuration=(3+Math.random()*3)+"s";



document.body.appendChild(h);



setTimeout(()=>{


h.remove();


},6000);



},i*30);



}




setTimeout(()=>{


window.location.href="page3.html";


},6000);



}



</script>



</body>

</html>
