<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Happy Moments ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

font-family:Poppins,sans-serif;

background:linear-gradient(-45deg,#ff758f,#ffb3c6,#ff4d6d,#ffc2d1);

background-size:400% 400%;

animation:bg 12s infinite;

}


@keyframes bg{

0%{background-position:0% 50%}

50%{background-position:100% 50%}

100%{background-position:0% 50%}

}


/* Heading */

h1{

font-family:"Great Vibes";

font-size:75px;

color:white;

text-shadow:

0 0 20px hotpink;

margin-bottom:30px;

}



/* Gallery */


.gallery{

display:flex;

gap:25px;

justify-content:center;

align-items:center;

}



.photo{

width:220px;

height:280px;

background:white;

padding:10px;

border-radius:20px;

box-shadow:0 0 30px pink;

opacity:0;

animation:pop 1s forwards;

}


.photo:nth-child(1){

animation-delay:.3s;

}


.photo:nth-child(2){

animation-delay:.8s;

}


.photo:nth-child(3){

animation-delay:1.3s;

}


.photo:nth-child(4){

animation-delay:1.8s;

}



@keyframes pop{

0%{

transform:scale(0) rotate(-20deg);

opacity:0;

}


100%{

transform:scale(1) rotate(0);

opacity:1;

}

}



.photo img{

width:100%;

height:220px;

object-fit:cover;

border-radius:15px;

}



.text{

text-align:center;

color:#ff4d88;

font-weight:bold;

margin-top:10px;

}





button{

margin-top:35px;

padding:15px 45px;

border:none;

border-radius:40px;

font-size:18px;

background:#ff2e63;

color:white;

cursor:pointer;

box-shadow:0 0 25px hotpink;

}



button:hover{

transform:scale(1.1);

}





/* Hearts */


.heart{

position:absolute;

bottom:-50px;

color:white;

opacity:.7;

animation:heartUp linear infinite;

}



@keyframes heartUp{


100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}


}


</style>

</head>


<body>



<h1>
Our Happy Moments ❤️
</h1>



<div class="gallery">


<div class="photo">

<img src="photo1.jpg">

<div class="text">
Our First Memory ❤️
</div>

</div>



<div class="photo">

<img src="photo2.jpg">

<div class="text">
Beautiful Days 💕
</div>

</div>



<div class="photo">

<img src="photo3.jpg">

<div class="text">
Crazy Smiles ❤️
</div>

</div>



<div class="photo">

<img src="photo4.jpg">

<div class="text">
Forever Together 💖
</div>

</div>


</div>



<button onclick="location.href='page5.html'">

Next Chapter ➜

</button>




<script>


// Floating hearts

for(let i=0;i<40;i++){


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


h.style.fontSize=(15+Math.random()*25)+"px";


h.style.animationDuration=(5+Math.random()*8)+"s";


document.body.appendChild(h);


}



</script>



</body>

</html>
